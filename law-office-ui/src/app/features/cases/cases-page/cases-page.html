<div class="p-6" dir="rtl">
    <p-toast></p-toast>
    <p-confirmDialog></p-confirmDialog>
    
    <!-- Header Area -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-800">إدارة القضايا</h1>
            <p class="text-slate-500">عرض وإدارة القضايا القانونية والموكلين</p>
        </div>
        <button pButton label="قضية جديدة" icon="pi pi-plus" class="p-button-primary shadow-md" (click)="openNew()"></button>
    </div>

    <!-- Filters Area -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold text-slate-500">البحث</label>
                <p-iconField iconPosition="left">
                    <p-inputIcon styleClass="pi pi-search"></p-inputIcon>
                    <input pInputText type="text" [(ngModel)]="searchTerm" (ngModelChange)="dt.filterGlobal($event, 'contains')"
                           placeholder="رقم القضية، العنوان..." class="w-full rounded-lg border-slate-200" />
                </p-iconField>
            </div>
            
            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold text-slate-500">الحالة</label>
                <p-select [options]="statuses" [(ngModel)]="selectedStatus" (onChange)="onFilterChange()"
                          optionLabel="label" optionValue="value" placeholder="كل الحالات" 
                          [showClear]="true" styleClass="w-full rounded-lg"></p-select>
            </div>

            <div class="flex flex-col gap-2">
                <label class="text-xs font-bold text-slate-500">الموكل</label>
                <p-select [options]="clients()" [(ngModel)]="selectedClient" (onChange)="onFilterChange()"
                          optionLabel="fullName" optionValue="id" placeholder="كل الموكلين" 
                          [showClear]="true" [filter]="true" styleClass="w-full rounded-lg"></p-select>
            </div>

            <div class="flex flex-col gap-2">
                <div class="flex gap-2">
                    <div class="flex-1 flex flex-col gap-2">
                        <label class="text-xs font-bold text-slate-500">المحامي</label>
                        <p-select [options]="lawyers()" [(ngModel)]="selectedLawyer" (onChange)="onFilterChange()"
                                  optionLabel="fullName" optionValue="id" placeholder="كل المحامين" 
                                  [showClear]="true" styleClass="w-full rounded-lg"></p-select>
                    </div>
                    <button pButton icon="pi pi-filter-slash" class="p-button-outlined p-button-secondary p-button-sm self-end h-[42px]" 
                            (click)="resetFilters()" pTooltip="إعادة تعيين"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Table Card -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <p-table #dt [value]="cases()" [loading]="loading()" [rows]="10" [paginator]="true" 
                 [globalFilterFields]="['caseNumber', 'title', 'clientName']"
                 styleClass="p-datatable-sm" [rowHover]="true"
                 responsiveLayout="scroll">
            
            <ng-template pTemplate="header">
                <tr class="bg-slate-50 text-slate-700">
                    <th pSortableColumn="caseNumber" class="p-4">رقم القضية <p-sortIcon field="caseNumber"></p-sortIcon></th>
                    <th pSortableColumn="title" class="p-4">عنوان القضية <p-sortIcon field="title"></p-sortIcon></th>
                    <th pSortableColumn="clientName" class="p-4">الموكل <p-sortIcon field="clientName"></p-sortIcon></th>
                    <th pSortableColumn="lawyerName" class="p-4">المحامي المسؤول <p-sortIcon field="lawyerName"></p-sortIcon></th>
                    <th pSortableColumn="status" class="p-4">الحالة <p-sortIcon field="status"></p-sortIcon></th>
                    <th pSortableColumn="startDate" class="p-4 text-center">تاريخ البدء <p-sortIcon field="startDate"></p-sortIcon></th>
                    <th class="p-4 text-center">الإجراءات</th>
                </tr>
            </ng-template>

            <ng-template pTemplate="body" let-case>
                <tr class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                    <td class="p-4 font-mono font-bold text-blue-600">
                        <a [routerLink]="['/cases', case.id]" class="hover:underline cursor-pointer">{{ case.caseNumber }}</a>
                    </td>
                    <td class="p-4 font-medium text-slate-800">
                        <a [routerLink]="['/cases', case.id]" class="hover:text-blue-600 cursor-pointer">{{ case.title }}</a>
                    </td>
                    <td class="p-4">{{ case.clientName }}</td>
                    <td class="p-4">
                        <div class="flex items-center gap-2">
                            <i class="pi pi-user text-xs text-slate-400"></i>
                            <span>{{ case.lawyerName }}</span>
                        </div>
                    </td>
                    <td class="p-4">
                        <p-tag [value]="getStatusLabel(case.status)" [severity]="getStatusSeverity(case.status)" styleClass="text-xs"></p-tag>
                    </td>
                    <td class="p-4 text-center text-slate-600">
                        {{ case.startDate | date:'dd/MM/yyyy' }}
                    </td>
                    <td class="p-4 text-center">
                        <div class="flex justify-center gap-2">
                            <button pButton icon="pi pi-eye" class="p-button-text p-button-info p-button-sm" [routerLink]="['/cases', case.id]"></button>
                            <button pButton icon="pi pi-pencil" class="p-button-text p-button-secondary p-button-sm" (click)="editCase(case)"></button>
                            <button pButton icon="pi pi-trash" class="p-button-text p-button-danger p-button-sm" (click)="deleteCase(case)"></button>
                        </div>
                    </td>
                </tr>
            </ng-template>

            <ng-template pTemplate="emptymessage">
                <tr>
                    <td colspan="7" class="p-12 text-center text-slate-500">
                        <div class="flex flex-col items-center gap-3">
                            <i class="pi pi-inbox text-4xl text-slate-200"></i>
                            <p>لم يتم العثور على قضايا تطابق البحث.</p>
                        </div>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>

    <app-case-dialog [case]="selectedCase()" 
                     [visible]="displayDialog()" 
                     (visibleChange)="displayDialog.set($event)"
                     (onSave)="onSave($event)">
    </app-case-dialog>
</div>
