<div class="space-y-4 pt-2">
    <div class="field">
        <label for="fullName" class="block font-medium text-slate-700 mb-1">الاسم الكامل <span class="text-red-500">*</span></label>
        <input type="text" pInputText id="fullName" [(ngModel)]="formData.fullName" required autofocus class="w-full border-slate-300" />
    </div>

    <div class="field">
        <label for="nationalId" class="block font-medium text-slate-700 mb-1">الرقم القومي <span class="text-red-500">*</span></label>
        <input type="text" pInputText id="nationalId" [(ngModel)]="formData.nationalId" required class="w-full border-slate-300" />
    </div>

    <div class="grid grid-cols-2 gap-4">
        <div class="field">
            <label for="phone" class="block font-medium text-slate-700 mb-1">الهاتف</label>
            <input type="text" pInputText id="phone" [(ngModel)]="formData.phone" class="w-full border-slate-300" dir="ltr" />
        </div>
        <div class="field">
            <label for="email" class="block font-medium text-slate-700 mb-1">البريد الإلكتروني</label>
            <input type="email" pInputText id="email" [(ngModel)]="formData.email" class="w-full border-slate-300" dir="ltr" />
        </div>
    </div>

    <div class="field">
        <label for="address" class="block font-medium text-slate-700 mb-1">العنوان</label>
        <input type="text" pInputText id="address" [(ngModel)]="formData.address" class="w-full border-slate-300" />
    </div>
</div>

<div class="flex justify-end gap-2 mt-6 border-t pt-4 border-slate-100">
    <p-button label="إلغاء" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="cancel()"></p-button>
    <p-button label="حفظ" icon="pi pi-check" (onClick)="save()" [disabled]="!formData.fullName || !formData.nationalId"></p-button>
</div>
