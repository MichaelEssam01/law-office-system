<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8" dir="rtl">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="flex justify-center text-blue-600">
            <i class="pi pi-shield text-5xl"></i>
        </div>
        <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
            مكتب المحاماة
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            تسجيل الدخول للنظام
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow-sm sm:rounded-lg sm:px-10 border border-gray-200">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
                <div *ngIf="errorMessage()" class="p-3 bg-red-50 border border-red-200 rounded-md">
                    <p class="text-sm text-red-600">{{ errorMessage() }}</p>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">البريد الإلكتروني</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <input id="email" formControlName="email" type="email" required 
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                               [class.border-red-500]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700">كلمة المرور</label>
                    <div class="mt-1">
                        <input id="password" formControlName="password" type="password" required 
                               class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                               [class.border-red-500]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input id="remember-me" name="remember-me" type="checkbox" 
                               class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label for="remember-me" class="mr-2 block text-sm text-gray-900">تذكرني</label>
                    </div>

                    <div class="text-sm">
                        <a href="#" class="font-medium text-blue-600 hover:text-blue-500">نسيت كلمة المرور؟</a>
                    </div>
                </div>

                <div>
                    <button type="submit" [disabled]="loginForm.invalid || loading()"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span *ngIf="!loading()">تسجيل الدخول</span>
                        <i *ngIf="loading()" class="pi pi-spin pi-spinner mr-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
