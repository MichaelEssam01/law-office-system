<div class="min-h-screen bg-gray-50 flex" [dir]="appState.currentLang() === 'ar' ? 'rtl' : 'ltr'">
    <!-- Sidebar (Desktop) -->
    <app-sidebar class="w-64 bg-white shadow-md z-20 hidden md:block"></app-sidebar>
    
    <!-- Mobile Sidebar (Overlay) -->
    <div *ngIf="appState.isSidebarOpen()" 
         class="fixed inset-0 bg-slate-900/50 z-30 md:hidden transition-opacity duration-300"
         (click)="appState.closeSidebar()"></div>

    <!-- Sidebar (Mobile) -->
    <app-sidebar class="fixed inset-y-0 z-40 w-64 bg-white shadow-2xl transition-transform duration-300 md:hidden"
                 [class.right-0]="appState.currentLang() === 'ar'"
                 [class.left-0]="appState.currentLang() !== 'ar'"
                 [class.translate-x-full]="!appState.isSidebarOpen() && appState.currentLang() === 'ar'"
                 [class.-translate-x-full]="!appState.isSidebarOpen() && appState.currentLang() !== 'ar'"></app-sidebar>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
        <!-- Header -->
        <app-header class="h-16 bg-white shadow-sm z-0 flex items-center px-4"></app-header>
        
        <!-- Page Content -->
        <main class="flex-1 overflow-y-auto p-4 md:p-6">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
