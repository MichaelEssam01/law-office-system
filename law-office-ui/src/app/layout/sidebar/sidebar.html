<div class="h-full flex flex-col bg-slate-900 text-white">
    <!-- Logo Area -->
    <div class="h-20 flex items-center justify-center border-b border-slate-800 px-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-lg bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-900/50">
                <i class="pi pi-balance-scale text-xl text-white"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide">العدل<span class="text-blue-400">برو</span></h1>
        </div>
    </div>
    
    <!-- Navigation -->
    <nav class="flex-1 overflow-y-auto py-6">
        <div class="px-4 mb-4">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">القائمة الرئيسية</p>
        </div>
        <ul class="space-y-1.5 px-3">
            <li *ngFor="let item of menuItems">
                <a [routerLink]="item.routerLink" 
                   routerLinkActive="bg-blue-600 text-white shadow-md shadow-blue-900/20"
                   [routerLinkActiveOptions]="{exact: item.routerLink === '/dashboard'}"
                   class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium cursor-pointer transition-all duration-200 text-slate-400 hover:bg-slate-800 hover:text-white">
                    <i [class]="item.icon + ' text-lg'"></i>
                    <span>{{ item.label }}</span>
                </a>
            </li>
        </ul>

        <div class="px-4 mt-8 mb-4">
            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">الإعدادات</p>
        </div>
        <ul class="space-y-1.5 px-3">
            <li>
                <a class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white font-medium cursor-pointer transition-all duration-200">
                    <i class="pi pi-cog text-lg"></i>
                    <span>إعدادات النظام</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Bottom Profile Area -->
    <div class="p-4 border-t border-slate-800">
        <a (click)="logout()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-red-400 font-medium cursor-pointer transition-all duration-200">
            <i class="pi pi-sign-out text-lg"></i>
            <span>تسجيل الخروج</span>
        </a>
    </div>
</div>
